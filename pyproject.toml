[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warehouse-agents-simulation"
version = "0.1.0"
description = "Reproducible disruption-robustness experiments for warehouse task allocation"
requires-python = ">=3.12"
dependencies = [
    "mesa[network]>=3.5,<3.6",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
warehouse-sim = "warehouse_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
